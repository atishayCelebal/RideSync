# Server
server.port=8080
server.address=0.0.0.0

# PostgreSQL Datasource
spring.datasource.url=jdbc:postgresql://localhost:5433/ridesync
spring.datasource.username=ridesync
spring.datasource.password=ridesync
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Kafka
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.consumer.group-id=ridesync-consumers
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.template.default-topic=ridesync.location

# Kafka Topics
kafka.topic.location=ridesync.location
kafka.topic.group.locations=ridesync.group.locations

# Websocket (placeholders for future use)
spring.websocket.enabled=true

# Logging
logging.level.org.springframework=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.apache.kafka=INFO

# Swagger OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Security / JWT
security.jwt.secret=UmlkZVN5bmNTZWN1cmVKd3RTZWNyZXRGb3JQcm9kdWN0aW9uVXNlU3Ryb25nU2VjcmV0S2V5
security.jwt.expiration-ms=3600000

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Application Configuration
app.name=RideSync
app.version=1.0.0
app.environment=development

# Scheduling Configuration
app.scheduling.enabled=true
app.location.polling.interval=120
app.location.simulation.interval=10
app.group.location.update.interval=60

# Smartcar API Configuration
smartcar.client.id=869c1221-b0e5-4c37-8be3-a2aeda3f1999
smartcar.client.secret=124bab3b-7d7a-458a-bc78-fa41143f362a
smartcar.redirect.uri=http://localhost:8080/api/smartcar/callback
smartcar.scope=read_vehicle_info read_location
smartcar.api.base.url=https://api.smartcar.com/v2.0
smartcar.auth.url=https://connect.smartcar.com/oauth/authorize
smartcar.token.url=https://auth.smartcar.com/oauth/token


